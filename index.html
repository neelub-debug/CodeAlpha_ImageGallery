<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1020">
    <meta name="description" content="Explore a collection of sunset, coding, and mountain images in this interactive image gallery.">
    <title>Image Gallery | Neelub Arooj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="page-head">
        <h1><span class="grad">Image Gallery</span></h1>
        <p>Pick a category, then click any image to view it full size.</p>
        <div id="filters" class="filters" role="group" aria-label="Filter images by category"></div>
    </header>

    <main>
        <section id="grid" class="grid" aria-label="Gallery images"></section>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-describedby="lb-count" hidden>
        <button class="lb-btn close" type="button" aria-label="Close viewer">&times;</button>
        <button class="lb-btn prev" type="button" aria-label="Previous image">&#8249;</button>
        <figure>
            <img id="lb-img" alt="" draggable="false">
            <figcaption><span id="lb-title"></span><span id="lb-count" aria-live="polite"></span></figcaption>
        </figure>
        <button class="lb-btn next" type="button" aria-label="Next image">&#8250;</button>
    </div>
</body>
</html>
